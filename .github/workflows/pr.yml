name: PR

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Create test output directory
        run: mkdir -p test-results

      - name: Vitest
        run: pnpm vitest run --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Cargo build
        run: cargo build
        working-directory: src-tauri

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cargo test
        run: cargo nextest run --profile ci --no-tests=warn
        working-directory: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit
        working-directory: src-tauri

      - name: Publish Vitest results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest
          path: test-results/vitest.xml
          reporter: java-junit

      - name: Publish Rust results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Cargo (nextest)
          path: test-results/nextest.xml
          reporter: java-junit
          fail-on-empty: false
