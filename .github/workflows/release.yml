name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate versions match tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          PKG_VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          TAURI_VERSION=$(node -e "process.stdout.write(require('./src-tauri/tauri.conf.json').version)")

          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version ($TAURI_VERSION)"
            exit 1
          fi

          echo "Version $VERSION matches package.json, Cargo.toml, and tauri.conf.json"

  test:
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test output directory
        run: mkdir -p test-results

      - name: Vitest
        run: pnpm vitest run --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cargo test
        run: cargo nextest run --profile ci --no-tests=warn
        working-directory: src-tauri

      - name: Publish Vitest results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest
          path: test-results/vitest.xml
          reporter: java-junit

      - name: Publish Rust results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Cargo (nextest)
          path: test-results/nextest.xml
          reporter: java-junit
          fail-on-empty: false

  build-macos:
    needs: [validate, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS .app bundle
        run: pnpm tauri build --bundles app

      - name: Re-sign app bundle to seal resources
        run: codesign --force --deep --sign - src-tauri/target/release/bundle/macos/2048.app

      - name: Package .app into DMG
        run: |
          hdiutil create \
            -volname "2048" \
            -srcfolder src-tauri/target/release/bundle/macos/2048.app \
            -ov -format UDZO \
            src-tauri/target/release/bundle/macos/2048.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/release/bundle/macos/*.dmg

  build-linux:
    needs: [validate, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux .deb
        run: pnpm tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine if pre-release
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: artifacts/**/*
